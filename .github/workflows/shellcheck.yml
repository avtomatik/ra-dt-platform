name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Analyze shell scripts
        shell: bash
        run: |
          find . -type f \
            \( -name '*.sh' -o -name '*.bash' \) \
            -not -path './.git/*' \
            -not -path './.venv/*' \
            -not -path './vendor/*' \
            -print0 |
            xargs -0 -r shellcheck --severity=warning
