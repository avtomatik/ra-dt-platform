services:
  postgres:
    image: postgres:17
    container_name: radp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RADP_DATABASE__NAME}
      POSTGRES_USER: ${RADP_DATABASE__USER}
      POSTGRES_PASSWORD: ${RADP_DATABASE__PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${RADP_DATABASE__USER} -d ${RADP_DATABASE__NAME}"]
      interval: 30m
      timeout: 10s
      retries: 5
      start_period: 20s
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - ra-network

  db-init:
    image: radp:latest
    container_name: radp-db-init
    env_file:
      - .env
    command:
      - /app/.venv/bin/python
      - -m
      - radp
      - db
      - create
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ra-network
    restart: "no"

  platform:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: radp:latest
    container_name: radp-platform
    restart: unless-stopped
    ports:
      - "9000:9000"
    env_file:
      - .env
    depends_on:
      db-init:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
    networks:
      - ra-network
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.sync.schedule: "0 0 2 * * *"
      ofelia.job-exec.sync.command: >
        /app/.venv/bin/python -m radp sync run
      ofelia.job-exec.sync.no-overlap: "true"

  scheduler:
    image: mcuadros/ofelia:latest
    container_name: radp-scheduler
    restart: unless-stopped
    command: ["daemon", "--docker"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      platform:
        condition: service_started
    networks:
      - ra-network

volumes:
  postgres-data:

networks:
  ra-network:
    name: ra-network
