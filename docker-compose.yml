services:
  postgres:
    image: ${DEPLOY_POSTGRES_IMAGE:?Set DEPLOY_POSTGRES_IMAGE}
    pull_policy: never
    container_name: radp-postgres
    restart: unless-stopped
    environment:
      DEPLOY_POSTGRES_IMAGE: ${DEPLOY_POSTGRES_IMAGE}
      POSTGRES_DB: ${RADP_DATABASE__DATABASE}
      POSTGRES_USER: ${RADP_DATABASE__USERNAME}
      POSTGRES_PASSWORD: ${RADP_DATABASE__PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 20s
    ports:
      - "5432:5432"
    networks:
      - ra-network

  db-init:
    image: radp:latest
    pull_policy: never
    container_name: radp-db-init
    env_file:
      - .env
    command:
      - /app/.venv/bin/python
      - -m
      - radp
      - bootstrap
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ra-network
    restart: "no"

  platform:
    image: radp:latest
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${DEPLOY_PYTHON_BASE_IMAGE:?Set DEPLOY_PYTHON_BASE_IMAGE}
        HTTP_PROXY: ${DEPLOY_HTTP_PROXY:-}
        HTTPS_PROXY: ${DEPLOY_HTTPS_PROXY:-}
        NO_PROXY: ${DEPLOY_NO_PROXY:-}
        http_proxy: ${DEPLOY_HTTP_PROXY:-}
        https_proxy: ${DEPLOY_HTTPS_PROXY:-}
        no_proxy: ${DEPLOY_NO_PROXY:-}
        DEPLOY_CONTAINER_GID: ${DEPLOY_CONTAINER_GID:?Set DEPLOY_CONTAINER_GID}
        DEPLOY_CONTAINER_UID: ${DEPLOY_CONTAINER_UID:?Set DEPLOY_CONTAINER_UID}
        DEPLOY_CONTAINER_USER: ${DEPLOY_CONTAINER_USER:?Set DEPLOY_CONTAINER_USER}
    container_name: radp-platform
    restart: unless-stopped
    ports:
      - "9000:9000"
    env_file:
      - .env
    depends_on:
      db-init:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config:ro
    networks:
      - ra-network
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.sync.schedule: "0 0 0 * * *"
      ofelia.job-exec.sync.command: >
        /app/.venv/bin/python -m radp sync run
      ofelia.job-exec.sync.no-overlap: "true"
      ofelia.job-exec.sync.user: "${DEPLOY_CONTAINER_USER:?Set DEPLOY_CONTAINER_USER}"

  scheduler:
    image: ${DEPLOY_OFELIA_IMAGE:?Set DEPLOY_OFELIA_IMAGE}
    pull_policy: never
    container_name: radp-scheduler
    restart: unless-stopped
    environment:
      DEPLOY_OFELIA_IMAGE: ${DEPLOY_OFELIA_IMAGE}
    command: ["daemon", "--docker"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      platform:
        condition: service_started
    networks:
      - ra-network

volumes:
  postgres-data:

networks:
  ra-network:
    name: ra-network
