[project]
name = "radp"
version = "0.1.0"
description = "Offline-first Python client and service framework for GOST-enabled Registration Authority REST APIs."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "apscheduler>=3.11.3",
    "cryptography>=48.0.0",
    "fastapi>=0.136.3",
    "httpx2>=2.10.0",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.1",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

gui = [
    "pyside6>=6.8",
]

[tool.pytest.ini_options]
markers = [
    "real: requires CryptoPro curl transport or external system",
    "integration: end-to-end flows",
]
