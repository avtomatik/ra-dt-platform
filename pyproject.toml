[project]
name = "radp"
version = "0.3.0"
description = "Offline-first Python client and service framework for GOST-enabled Registration Authority REST APIs."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "httpx2>=2.13.1",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
    "xlsxwriter>=3.2.9",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

gui = [
    "pyside6>=6.8",
]

[tool.pytest.ini_options]
markers = [
    "real: requires CryptoPro curl transport or external system",
    "integration: end-to-end flows",
]
