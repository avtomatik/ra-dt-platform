<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}RADP{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/radp.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="/" aria-label="RADP — главная страница">
        <span class="brand-mark" aria-hidden="true">R</span>
        <span class="brand-name">RADP</span>
      </a>
      <span class="header-caption">Registry Authority Data Platform</span>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <span>RADP</span>
      <span>Локальная система управления сертификатами</span>
    </footer>
  </div>
</body>
</html>
